<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Case Studies · HITLOOP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Doto:wght@400;700;900&family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#0a0a0a;--ink-soft:#5a5346;--line:rgba(212,196,171,0.82);--card:rgba(255,255,255,0.5);--hl:rgba(255,255,255,0.65);--grad:linear-gradient(92deg,#7a5cff 0%,#b14bff 38%,#ff4fa1 72%,#ff7a3a 100%);--gutter:max(8vw,calc((100% - 1100px)/2))}
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{font-family:"Space Grotesk",system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(700px 420px at 0% 4%,rgba(255,120,90,0.38) 0%,transparent 65%),radial-gradient(620px 380px at 100% 16%,rgba(176,90,255,0.32) 0%,transparent 65%),radial-gradient(700px 420px at 0% 40%,rgba(255,90,160,0.30) 0%,transparent 65%),radial-gradient(620px 400px at 100% 72%,rgba(200,90,255,0.28) 0%,transparent 65%),linear-gradient(180deg,#fefdf9 0%,#fbf8f0 50%,#fdfaf2 100%);
    -webkit-font-smoothing:antialiased;min-height:100vh}
  .nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:18px clamp(20px,4vw,40px);background:rgba(246,243,234,0.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(0,0,0,0.04)}
  .sig{font-family:"Caveat",cursive,serif;font-size:28px;font-weight:600;letter-spacing:-.02em;color:#111;text-decoration:none}
  .nav-cta{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;color:#fff;font-family:"Space Grotesk";font-size:14px;font-weight:500;text-decoration:none;background:var(--grad);box-shadow:0 1px 0 rgba(255,255,255,0.35) inset,0 8px 24px rgba(122,92,255,0.25)}
  .hero{padding:clamp(56px,10vh,120px) var(--gutter) clamp(32px,5vh,56px)}
  .eyebrow{font-family:"Space Mono";font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);display:flex;gap:18px;align-items:center;margin-bottom:24px}
  .eyebrow .dot{width:6px;height:6px;background:var(--ink);border-radius:50%}
  .headline{font-family:"Doto";font-weight:900;letter-spacing:-.01em;line-height:.92;font-size:clamp(52px,10vw,140px);margin:0 0 20px;text-transform:uppercase}
  .sub{font-family:"Space Grotesk";font-weight:300;font-size:clamp(19px,2.2vw,30px);line-height:1.25;color:#1a1a1a;max-width:52ch;margin:0}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;padding:clamp(24px,4vh,48px) var(--gutter) clamp(64px,10vh,120px)}
  @media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}
  @media(max-width:640px){.grid{grid-template-columns:1fr}}
  .cs{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 1px 0 var(--hl),inset 0 1px 0 rgba(255,255,255,0.4);overflow:hidden;transition:transform .18s ease,box-shadow .18s ease}
  .cs:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(122,92,255,0.16)}
  .cs .thumb{aspect-ratio:16/10;background:rgba(255,255,255,.3);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:"Space Mono";font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);background-size:cover;background-position:center}
  .cs .body{padding:22px}
  .cs .vol{font-family:"Space Mono";font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:10px;display:flex;justify-content:space-between}
  .cs .name{font-family:"Doto";font-weight:900;text-transform:uppercase;font-size:26px;line-height:1;margin:0 0 12px}
  .cs .line{font-family:"Space Grotesk";font-weight:300;font-size:15px;line-height:1.45;color:#333;margin:0 0 16px}
  .cs .stat{font-family:"Doto";font-weight:900;font-size:34px;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .cs .stat small{display:block;font-family:"Space Mono";font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);-webkit-text-fill-color:var(--ink-soft);margin-top:6px}
  .badge{font-family:"Space Mono";font-size:9px;letter-spacing:.18em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:#fff}
  .draft{opacity:.6}
  footer{padding:40px var(--gutter);font-family:"Space Mono";font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;border-top:1px solid rgba(0,0,0,.06)}
</style>
</head>
<body>
<nav class="nav">
  <a class="sig" href="/">HITLOOP</a>
  <a class="nav-cta" href="/start">Start a project ↗</a>
</nav>

<section class="hero">
  <div class="eyebrow"><span>Selected Work</span><span class="dot"></span><span>Case Studies</span></div>
  <h1 class="headline">Proof,<br>not promises.</h1>
  <p class="sub">Real brands, real systems, real numbers. Here's what an always-on content engine actually does.</p>
</section>

<div class="grid" id="grid"></div>

<footer>
  <span>HITLOOP · Case Studies</span>
  <span>hitloop.studio</span>
</footer>

<script>
const CARDS = [
  { id:"fernwood",      vol:"04", tag:"Coffee",      name:"Fernwood Roasters", line:"A quiet feed and a dead email list, turned into an always-on content engine.", stat:"3.4×", statLbl:"DTC subscription revenue", ready:true },
  { id:"viva-acid",     vol:"01", tag:"Music",       name:"Viva Acid",         line:"TODO — one-line hook.", stat:"TODO", statLbl:"Headline metric", ready:false },
  { id:"critters-quest",vol:"02", tag:"Game",        name:"Critters Quest",    line:"TODO — one-line hook.", stat:"TODO", statLbl:"Headline metric", ready:false },
  { id:"edit-trax",     vol:"03", tag:"Audio",       name:"Edit Trax",         line:"TODO — one-line hook.", stat:"TODO", statLbl:"Headline metric", ready:false },
  { id:"not-the-rug",   vol:"05", tag:"Web3",        name:"Not the Rug",       line:"TODO — one-line hook.", stat:"TODO", statLbl:"Headline metric", ready:false },
  { id:"passion-house", vol:"06", tag:"Coffee",      name:"Passion House",     line:"TODO — one-line hook.", stat:"TODO", statLbl:"Headline metric", ready:false },
  { id:"rositas",       vol:"07", tag:"Restaurant",  name:"Rosita's",          line:"TODO — one-line hook.", stat:"TODO", statLbl:"Headline metric", ready:false },
  { id:"hitloop",       vol:"08", tag:"Platform",    name:"HITLOOP",           line:"TODO — how HITLOOP markets HITLOOP.", stat:"TODO", statLbl:"Headline metric", ready:false }
];
document.getElementById('grid').innerHTML = CARDS.map(c=>`
  <a class="cs ${c.ready?'':'draft'}" href="case-study-template.html?client=${c.id}">
    <div class="thumb">${c.ready?'Cover image':'Placeholder'}</div>
    <div class="body">
      <div class="vol"><span>Vol. ${c.vol} · ${c.tag}</span>${c.ready?'':'<span class="badge">Draft</span>'}</div>
      <h3 class="name">${c.name}</h3>
      <p class="line">${c.line}</p>
      <div class="stat">${c.stat}<small>${c.statLbl}</small></div>
    </div>
  </a>`).join("");
</script>
</body>
</html>
