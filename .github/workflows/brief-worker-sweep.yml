name: Brief Worker Sweep

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Drain one queued brief run
        env:
          HITLOOP_CRON_SECRET: ${{ secrets.HITLOOP_CRON_SECRET }}
        run: |
          if [ -z "$HITLOOP_CRON_SECRET" ]; then
            echo "Missing HITLOOP_CRON_SECRET repository secret." >&2
            exit 1
          fi

          curl --fail --show-error --silent \
            --request GET \
            --header "Authorization: Bearer ${HITLOOP_CRON_SECRET}" \
            https://hitloop.agency/api/worker/run-brief
