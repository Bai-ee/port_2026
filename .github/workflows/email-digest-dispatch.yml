name: Email Digest Dispatch

# NOT ENABLED — this file only takes effect once committed to the DEFAULT
# branch and GitHub Actions picks up the schedule from there. It currently
# lives on fix/email-digest-phase-0-1, a feature branch, so it is inert by
# construction: GitHub only schedules workflow files present on the repo's
# default branch. Written per direction ("GH workflow written-not-enabled")
# so the file exists and is reviewable before Phase 1's exit gate (two clean
# automatic mornings on the existing daily cron) closes — do not merge this
# to the default branch before that gate closes.
#
# What it does once enabled: pings /api/worker/email-digest-dispatch every 30
# minutes. That route finds enrolled clients whose per-client sendHour has
# come due (real per-client scheduling, replacing the single global cron
# time every enrolled client shared before), atomically claims each one, and
# fires the same two already-hardened worker calls the existing daily cron
# uses (pre-digest-refresh then daily-digest, both scoped to that one
# client) — see app/api/worker/email-digest-dispatch/route.js for the full
# design rationale (claim-one-then-process-one, budget-bounded).
#
# Mirrors the already-live brief-worker-sweep.yml / digest-delivery-sweep.yml
# in this same directory: same repository secret, same Bearer auth header
# shape, same hitloop.agency target. Vercel Hobby caps cron schedules at
# once-per-day (docs/source-of-truth/VERCEL-HOBBY-DEPLOYMENT.md), so the
# 30-minute cadence this needs can only come from an external pinger like
# this workflow, not vercel.json.
#
# Required before enabling: the HITLOOP_CRON_SECRET repository secret must
# already be set (the other two sweep workflows already depend on it) and
# must match the deployed CRON_SECRET env var. The existing daily
# vercel.json cron for /api/admin/daily-digest stays as the fallback path
# until this dispatcher canaries clean — re-pointing away from it is a
# separate, explicitly gated step, not part of enabling this file.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch due per-client digest occurrences
        env:
          HITLOOP_CRON_SECRET: ${{ secrets.HITLOOP_CRON_SECRET }}
        run: |
          if [ -z "$HITLOOP_CRON_SECRET" ]; then
            echo "Missing HITLOOP_CRON_SECRET repository secret." >&2
            exit 1
          fi

          curl --fail --show-error --silent \
            --request POST \
            --header "Authorization: Bearer ${HITLOOP_CRON_SECRET}" \
            "https://hitloop.agency/api/worker/email-digest-dispatch"
