<!doctype html>
<!--
  scene.html — Slice 4b feasibility spike ONLY. Not part of any real render
  pipeline; not imported/loaded by anything in recipe.mjs/scene.mjs/render.mjs
  /server.mjs (the live Video Promo path) or by ClothStudio.jsx. Exists solely
  to prove, empirically, that a three.js scene driven by a FIXED timestep
  (never wall-clock) plus a SEEDED texture generator (never Math.random())
  produces byte-identical frames across repeated headless runs — the two
  concrete determinism gaps found in ClothStudio.jsx's real render loop (see
  the Slice 4b checkpoint's findings). Loads three.js from a plain relative
  <script type="module"> — served locally (see serve-and-capture.mjs), never
  a CDN, never any network beyond 127.0.0.1.

  Deliberately a SMALL synthetic scene (one lit torus + one seeded procedural
  grain texture), not a reconstruction of ClothStudio's actual cloth/element
  system — full-fidelity scene reconstruction is Slice 4c's job
  (`art-scene.mjs`), not this spike's.
-->
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:#000}</style></head>
<body>
<canvas id="c" width="256" height="256"></canvas>
<script type="module">
import * as THREE from './three.module.min.js';

// mulberry32 — verbatim copy of app/dashboard/studio/elements/randomize.js's
// own implementation (that file is a browser bundler-resolved ES module this
// plain unbundled page can't import directly; the algorithm itself is what's
// being proven reusable, not a new one).
function mulberry32(seed) {
  let a = seed >>> 0;
  return function rand() {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Seeded stand-in for ClothStudio.jsx's real makeGrainCanvas()/film-grain
// generator, which uses raw Math.random() (see Slice 4b findings) — this is
// the fix pattern 4c would apply: same visual effect, deterministic given a
// seed.
function makeSeededGrainTexture(seed) {
  const rand = mulberry32(seed);
  const size = 64;
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 118 + Math.floor(rand() * 60) + Math.floor(rand() * 60);
    img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  return tex;
}

const FPS = 24;
const DT = 1 / FPS;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setSize(256, 256, false);
renderer.setPixelRatio(1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 60);
camera.position.set(0, 0, 3);
camera.lookAt(0, 0, 0);

const key = new THREE.PointLight(0xffffff, 30, 20);
key.position.set(2, 2, 2);
scene.add(key);
const rim = new THREE.PointLight(0x88ffee, 12, 20);
rim.position.set(-2, -1, -2);
scene.add(rim);

const seed = Number(new URLSearchParams(location.search).get('seed') || 1);
const grain = makeSeededGrainTexture(seed);
grain.wrapS = grain.wrapT = THREE.RepeatWrapping;
grain.repeat.set(4, 4);

const material = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.35, metalness: 0.6, bumpMap: grain, bumpScale: 0.02 });
const mesh = new THREE.Mesh(new THREE.TorusGeometry(0.9, 0.32, 32, 64), material);
scene.add(mesh);

// FIXED timestep — driven purely by an explicit frame index, never
// requestAnimationFrame/clock.getDelta()/performance.now()/Date.now(). This
// is the exact swap ClothStudio.jsx's real loop (`world.clock.getDelta()`,
// wall-clock) would need for a deterministic Proof render (Slice 4b finding).
window.__renderFrame = function renderFrame(frameIndex) {
  const t = frameIndex * DT;
  mesh.rotation.y = t * 1.3;
  mesh.rotation.x = Math.sin(t * 0.7) * 0.4;
  renderer.render(scene, camera);
  return canvas.toDataURL('image/png');
};

window.__sceneReady = true;
</script>
</body>
</html>
